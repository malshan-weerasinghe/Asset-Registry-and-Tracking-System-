services:
  # ============================
  # SQL Server Database
  # ============================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: "Express"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ============================
  # Asset Registry Service
  # ============================
  asset-registry:
    build:
      context: .
      dockerfile: ./src/Services/AssetRegistry/Dockerfile
    container_name: asset-registry
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AssetRegistryDb: "Server=sqlserver;Database=AssetRegistry;User Id=sa;Password=YourStrong@Passw0rd;Encrypt=True;TrustServerCertificate=True"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  # ============================
  # Identity Access Service
  # ============================
  identity-access:
    build:
      context: .
      dockerfile: ./src/Services/IdentityAccess/DockerFile
    container_name: identity-access
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AsgardeoSettings__OrganizationName: "group12linux"
      AsgardeoSettings__ClientId: "Cb0TPnGeXut7j4qNKVBsHPFJ54ka"
      AsgardeoSettings__ClientSecret: "9rfj_fR60MQ1HcwiUvfkwIfHhPd0jl6bzNr5uB6aiXIa"
      AsgardeoSettings__Scope: "internal_user_mgt_create internal_user_mgt_list internal_user_mgt_view internal_user_mgt_delete internal_user_mgt_update internal_role_mgt_users_update"
      AsgardeoSettings__AuditorRoleId: "853b92a3-8e33-4592-a3c5-db24ab4d4486"
      AsgardeoSettings__UserRoleId: "35355519-f472-4634-b28e-fb42d5d2b92e"
    restart: unless-stopped

  # ============================
  # Maintenance Scheduler Service
  # ============================
  maintenance-scheduler:
    build:
      context: .
      dockerfile: ./src/Services/MaintenanceScheduler/Dockerfile
    container_name: maintenance-scheduler
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=MaintenanceSchedulerDB;User Id=sa;Password=YourStrong@Passw0rd;Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=true"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  # ============================
  # Notification Service
  # ============================
  notification:
    build:
      context: .
      dockerfile: ./src/Services/Notification/Dockerfile
    container_name: notification
    ports:
      - "5005:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    restart: unless-stopped

volumes:
  sqlserver-data:
    driver: local

networks:
  default:
    name: microservices-network
    driver: bridge  